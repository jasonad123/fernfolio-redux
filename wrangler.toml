# Cloudflare Pages build configuration. Committing this lets Cloudflare Pages'
# git integration read build settings from the repo instead of requiring
# manual entry in the CF dashboard (mirrors netlify.toml's role for Netlify).
#
# `pages_build_output_dir` is the current key for this - see
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/.
# Whether Cloudflare Pages' git-integration build pipeline also picks up the
# [build] command below, or still needs "Build command" set manually in the
# CF dashboard, wasn't verifiable from this environment - check the current
# CF Pages docs / your project's dashboard settings if the build doesn't run
# automatically.
name = "fernfolio-redux"
pages_build_output_dir = "_site"

[build]
command = "pnpm run build"
